name: 'BI_BIGDATA_UNIDAD2'
version: '1.0.0'
config-version: 2

# Configuración del perfil de conexión
profile: 'default'

# Rutas de carpetas del proyecto
model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Configuración de materialización y esquemas (Silver -> Gold)
models:
  BI_BIGDATA_UNIDAD2:
    staging:
      +materialized: view
      +schema: silver
    marts:
      +materialized: table
      +schema: gold
